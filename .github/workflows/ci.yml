name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Arquitectura por capas
        run: pnpm check:layers

      - name: Documentación de funciones al día
        run: pnpm check:features

      - name: Pruebas
        run: pnpm test

      - name: Cobertura
        run: pnpm test:coverage

      - name: Compilación
        run: pnpm build

      - name: Instalar navegadores Playwright
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm exec playwright install --with-deps chromium webkit
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Pruebas E2E en navegador real
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PLAYWRIGHT_WEBKIT=1 pnpm test:e2e
          else
            pnpm test:e2e
          fi
