name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Arquitectura por capas
        run: pnpm check:layers

      - name: Documentación de funciones al día
        run: pnpm check:features

      - name: Pruebas
        run: pnpm test

      - name: Compilación
        run: pnpm exec vite build
